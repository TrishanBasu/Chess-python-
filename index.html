<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Chess Engine vs AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chess.js library for rule validation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            aspect-ratio: 1 / 1;
        }

        .square {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .square-light { background-color: #f0d9b5; }
        .square-dark { background-color: #b58863; }
        .square-selected { background-color: #7b61ff !important; }
        .square-highlight-last { background-color: rgba(255, 255, 50, 0.5) !important; }
        .square-highlight-check { background-color: #ff4d4d !important; }

        .move-hint {
            position: absolute;
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.2);
            pointer-events: none;
        }

        .capture-hint {
            position: absolute;
            width: 85%;
            height: 85%;
            border-radius: 50%;
            border: 4px solid rgba(0, 0, 0, 0.2);
            pointer-events: none;
        }

        .piece {
            width: 90%;
            height: 90%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 10;
            transition: transform 0.15s ease-in-out;
        }

        .piece:hover { transform: scale(1.08); }

        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(0, 0, 0, 0.1); border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: rgba(0, 0, 0, 0.3); border-radius: 4px; }
    </style>
</head>

            'bR': '<svg viewBox="0 0 45 45"><g fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 39h27v-3H9v3zM12 36h21l-1.5-4h-18L12 36zM11 14h23v7H11v-7zM14 21h17v11H14V21zM11 9h4v5h-4V9zM20.5 9h4v5h-4V9zM30 9h4v5h-4V9z"/></g></svg>',
            'bQ': '<svg viewBox="0 0 45 45"><g fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><path d="M8 36h29v-3H8v3zM11 33h23l-2-5H13l-2 5zM9 26l3.5-12 5.5 8 4.5-13 4.5 13 5.5-8 3.5 12H9z"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="9" r="2"/><circle cx="22.5" cy="6" r="2"/><circle cx="27" cy="9" r="2"/><circle cx="36" cy="12" r="2"/></g></svg>',
            'bK': '<svg viewBox="0 0 45 45"><g fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22.5 11.63V6M20 8h5M22.5 25c-4 0-7.5 1.5-7.5 4v5h15v-5c0-2.5-3.5-4-7.5-4z"/><path d="M11.5 37h22v-3h-22v3zM22.5 11.5c-3.5 0-5.5 2.5-5.5 6.5 0 5 5.5 7 5.5 7s5.5-2 5.5-7c0-4-2-6.5-5.5-6.5z"/></g></svg>'
        };

        class SoundFX {
            constructor() { this.ctx = null; }
            init() { if (!this.ctx) this.ctx = new (window.AudioContext || window.webkitAudioContext)(); }
            playMove() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.08);
            }
            playCapture() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain); gain.connect(this.ctx.destination);
                osc.start(); osc.stop(this.ctx.currentTime + 0.12);
            }
        }
        const sfx = new SoundFX();

        let game = new Chess();
        let selectedSquare = null;
        let legalMoves = [];
        let isFlipped = false;
        let lastMove = null;

        // Clock Variables
        let playerTime = 600;
        let aiTime = 600;
        let timerInterval = null;
        let gameEnded = false;

        // High-Precision Piece-Square Evaluation Tables (PST)
        const weights = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };

        const pstPawn = [
            0,  0,  0,  0,  0,  0,  0,  0,
            50, 50, 50, 50, 50, 50, 50, 50,
            10, 10, 20, 30, 30, 20, 10, 10,
             5,  5, 10, 25, 25, 10,  5,  5,
             0,  0,  0, 20, 20,  0,  0,  0,
             5, -5,-10,  0,  0,-10, -5,  5,
             5, 10, 10,-20,-20, 10, 10,  5,
             0,  0,  0,  0,  0,  0,  0,  0
        ];

        const pstKnight = [
            -50,-40,-30,-30,-30,-30,-40,-50,
            -40,-20,  0,  0,  0,  0,-20,-40,
            -30,  0, 10, 15, 15, 10,  0,-30,
            -30,  5, 15, 20, 20, 15,  5,-30,
            -30,  0, 15, 20, 20, 15,  0,-30,
            -30,  5, 10, 15, 15, 10,  5,-30,
            -40,-20,  0,  5,  5,  0,-20,-40,
            -50,-40,-30,-30,-30,-30,-40,-50
        ];

        const pstBishop = [
            -20,-10,-10,-10,-10,-10,-10,-20,
            -10,  0,  0,  0,  0,  0,  0,-10,
            -10,  0,  5, 10, 10,  5,  0,-10,
            -10,  5,  5, 10, 10,  5,  5,-10,
            -10,  0, 10, 10, 10, 10,  0,-10,
            -10, 10, 10, 10, 10, 10, 10,-10,
            -10,  5,  0,  0,  0,  0,  5,-10,
            -20,-10,-10,-10,-10,-10,-10,-20
        ];

        const pstRook = [
              0,  0,  0,  0,  0,  0,  0,  0,
              5, 10, 10, 10, 10, 10, 10,  5,
             -5,  0,  0,  0,  0,  0,  0, -5,
             -5,  0,  0,  0,  0,  0,  0, -5,
             -5,  0,  0,  0,  0,  0,  0, -5,
             -5,  0,  0,  0,  0,  0,  0, -5,
             -5,  0,  0,  0,  0,  0,  0, -5,
              0,  0,  0,  5,  5,  0,  0,  0
        ];

        const pstQueen = [
            -20,-10,-10, -5, -5,-10,-10,-20,
            -10,  0,  0,  0,  0,  0,  0,-10,
            -10,  0,  5,  5,  5,  5,  0,-10,
             -5,  0,  5,  5,  5,  5,  0, -5,
              0,  0,  5,  5,  5,  5,  0, -5,
            -10,  5,  5,  5,  5,  5,  0,-10,
            -10,  0,  5,  0,  0,  0,  0,-10,
            -20,-10,-10, -5, -5,-10,-10,-20
        ];

        const pstKing = [
            -30,-40,-40,-50,-50,-40,-40,-30,
            -30,-40,-40,-50,-50,-40,-40,-30,
            -30,-40,-40,-50,-50,-40,-40,-30,
            -30,-40,-40,-50,-50,-40,-40,-30,
            -20,-30,-30,-40,-40,-30,-30,-20,
            -10,-20,-20,-20,-20,-20,-20,-10,
             20, 20,  0,  0,  0,  0, 20, 20,
             20, 30, 10,  0,  0, 10, 30, 20
        ];

        function evaluateBoard(board) {
            let total = 0;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        let val = weights[piece.type];
                        let idx = r * 8 + c;
                        let mirrorIdx = (7 - r) * 8 + c;

                        if (piece.type === 'p') val += piece.color === 'w' ? pstPawn[mirrorIdx] : pstPawn[idx];
                        else if (piece.type === 'n') val += piece.color === 'w' ? pstKnight[mirrorIdx] : pstKnight[idx];
                        else if (piece.type === 'b') val += piece.color === 'w' ? pstBishop[mirrorIdx] : pstBishop[idx];
                        else if (piece.type === 'r') val += piece.color === 'w' ? pstRook[mirrorIdx] : pstRook[idx];
                        else if (piece.type === 'q') val += piece.color === 'w' ? pstQueen[mirrorIdx] : pstQueen[idx];
                        else if (piece.type === 'k') val += piece.color === 'w' ? pstKing[mirrorIdx] : pstKing[idx];

                        total += piece.color === 'w' ? val : -val;
                    }
                }
            }
            return total;
        }

        function minimax(depth, alpha, beta, isMaximizing) {
            if (depth === 0 || game.game_over()) {
                return evaluateBoard(game.board());
            }

            // Move ordering: prioritizes captures for deeper pruning efficiency
            const moves = game.moves({ verbose: true });
            moves.sort((a, b) => (b.captured ? 10 : 0) - (a.captured ? 10 : 0));

            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let move of moves) {
                    game.move(move);
                    let evalVal = minimax(depth - 1, alpha, b
