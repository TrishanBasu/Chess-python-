<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS Chess Engine vs AI</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Chess.js library for rule validation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.10.3/chess.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap');
        
        body {
            font-family: 'Inter', sans-serif;
            user-select: none;
            -webkit-user-select: none;
        }

        .board-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            grid-template-rows: repeat(8, 1fr);
            aspect-ratio: 1 / 1;
        }

        .square {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
        }

        .square-light {
            background-color: #f0d9b5;
        }

        .square-dark {
            background-color: #b58863;
        }

        .square-selected {
            background-color: #7b61ff !important;
        }

        .square-highlight-last {
            background-color: rgba(255, 255, 50, 0.5) !important;
        }

        .square-highlight-check {
            background-color: #ff4d4d !important;
        }

        .move-hint {
            position: absolute;
            width: 30%;
            height: 30%;
            border-radius: 50%;
            background-color: rgba(0, 0, 0, 0.2);
            pointer-events: none;
        }

        .capture-hint {
            position: absolute;
            width: 85%;
            height: 85%;
            border-radius: 50%;
            border: 4px solid rgba(0, 0, 0, 0.2);
            pointer-events: none;
        }

        .piece {
            width: 90%;
            height: 90%;
            background-size: contain;
            background-repeat: no-repeat;
            background-position: center;
            z-index: 10;
            transition: transform 0.15s ease-in-out;
        }

        .piece:hover {
            transform: scale(1.08);
        }

        /* Custom Scrollbars */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: rgba(0, 0, 0, 0.1);
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 4px;
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between items-center p-2 sm:p-4">

    <header class="w-full max-w-5xl flex justify-between items-center py-3 px-4 bg-slate-800 rounded-xl shadow-lg border border-slate-700 mb-4">
        <div class="flex items-center gap-3">
            <i class="fa-solid font-bold text-2xl text-indigo-400 fa-chess-king"></i>
            <h1 class="text-xl font-bold tracking-wide text-white">Grandmaster AI</h1>
        </div>
        <div class="flex items-center gap-2">
            <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30">
                White's Turn
            </span>
        </div>
    </header>

    <main class="w-full max-w-5xl flex flex-col lg:flex-row gap-4 items-center lg:items-start justify-center flex-grow">
        
        <!-- Left Column: Game Board -->
        <div class="w-full max-w-[520px] flex flex-col gap-2">
            
            <!-- Top Player Bar (AI) -->
            <div class="flex justify-between items-center bg-slate-800 p-2.5 rounded-lg border border-slate-700">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-slate-700 flex items-center justify-center border border-slate-600">
                        <i class="fa-solid fa-robot text-slate-300"></i>
                    </div>
                    <div>
                        <div class="text-sm font-semibold text-slate-200" id="ai-name">Stockfish AI (Medium)</div>
                        <div class="text-xs text-slate-400 flex gap-1 h-4" id="ai-captured"></div>
                    </div>
                </div>
                <div id="ai-thinking" class="hidden text-xs text-indigo-400 font-medium flex items-center gap-1.5">
                    <i class="fa-solid fa-spinner animate-spin"></i> Thinking...
                </div>
            </div>

            <!-- Chess Board -->
            <div class="relative w-full rounded-lg overflow-hidden shadow-2xl border-2 border-slate-700 bg-slate-800">
                <div id="board" class="board-grid w-full"></div>
            </div>

            <!-- Bottom Player Bar (Human) -->
            <div class="flex justify-between items-center bg-slate-800 p-2.5 rounded-lg border border-slate-700">
                <div class="flex items-center gap-2">
                    <div class="w-8 h-8 rounded-full bg-indigo-600 flex items-center justify-center text-white font-bold">
                        <i class="fa-solid fa-user text-sm"></i>
                    </div>
                    <div>
                        <div class="text-sm font-semibold text-slate-200">You (Player)</div>
                        <div class="text-xs text-slate-400 flex gap-1 h-4" id="player-captured"></div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Right Column: Sidebar Controls and Info -->
        <div class="w-full max-w-[520px] lg:w-80 flex flex-col gap-4">
            
            <!-- Controls Panel -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col gap-3 shadow-md">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400">Game Configuration</h2>
                
                <div class="flex flex-col gap-1.5">
                    <label for="difficulty" class="text-xs text-slate-300">Difficulty Level</label>
                    <select id="difficulty" class="bg-slate-900 border border-slate-700 rounded-lg p-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500">
                        <option value="1">Easy (Depth 1)</option>
                        <option value="2" selected>Medium (Depth 2)</option>
                        <option value="3">Hard (Depth 3)</option>
                    </select>
                </div>

                <div class="flex gap-2 mt-1">
                    <button id="btn-new-game" class="flex-1 bg-indigo-600 hover:bg-indigo-500 active:bg-indigo-700 text-white py-2 px-3 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-rotate-right"></i> New Game
                    </button>
                    <button id="btn-flip" class="bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 px-3 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-arrow-rotate-left"></i> Flip
                    </button>
                    <button id="btn-undo" class="bg-slate-700 hover:bg-slate-600 text-slate-200 py-2 px-3 rounded-lg text-sm font-semibold flex items-center justify-center gap-2 transition-all">
                        <i class="fa-solid fa-backward"></i> Undo
                    </button>
                </div>
            </div>

            <!-- Move History Panel -->
            <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-col flex-grow shadow-md min-h-[220px]">
                <h2 class="text-xs font-bold uppercase tracking-wider text-slate-400 mb-2">Move Notation</h2>
                <div id="move-history" class="overflow-y-auto max-h-[240px] pr-2 text-sm text-slate-300 grid grid-cols-2 gap-x-4 gap-y-1 font-mono">
                    <!-- Moves added dynamically -->
                </div>
            </div>
        </div>
    </main>

    <footer class="w-full max-w-5xl text-center text-xs text-slate-500 py-3 mt-4">
        Grandmaster AI Chess &bull; Single File Implementation with Minimax Engine
    </footer>

            'wQ': '<svg viewBox="0 0 45 45"><g fill="#fff" stroke="#000" stroke-width="1.5" stroke-linecap="round"><path d="M8 36h29v-3H8v3zM11 33h23l-2-5H13l-2 5zM9 26l3.5-12 5.5 8 4.5-13 4.5 13 5.5-8 3.5 12H9z"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="9" r="2"/><circle cx="22.5" cy="6" r="2"/><circle cx="27" cy="9" r="2"/><circle cx="36" cy="12" r="2"/></g></svg>',

            'bP': '<svg viewBox="0 0 45 45"><path d="M22.5 9c-2.21 0-4 1.79-4 4 0 .89.29 1.71.78 2.38C17.33 16.5 16 18.59 16 21c0 2.03.94 3.84 2.41 5.03C15.41 27.09 11 31.58 11 37h23c0-5.42-4.41-9.91-7.41-10.97C28.06 24.84 29 23.03 29 21c0-2.41-1.33-4.5-3.28-5.62.49-.67.78-1.49.78-2.38 0-2.21-1.79-4-4-4z" fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/></svg>',
            'bN': '<svg viewBox="0 0 45 45"><path d="M 22,10 C 32.5,11 38.5,18 38,39 L 15,39 C 15,30 25,32.5 23,18 C 21.5,14 18,15 12,18 C 11,15 13,10 22,10 z" fill="#000" stroke="#fff" stroke-width="1.5"/><circle cx="27" cy="16" r="1.5" fill="#fff"/></svg>',
            'bB': '<svg viewBox="0 0 45 45"><g fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><path d="M9 36c0-2 1-4 2-4h22c1 0 2 2 2 4H9z"/><path d="M15 32c0-2.5 2.5-4 7.5-4s7.5 1.5 7.5 4H15z"/><path d="M22.5 10a5 5 0 0 0-5 5c0 3 2.5 6.5 5 10 2.5-3.5 5-7 5-10a5 5 0 0 0-5-5z"/><circle cx="22.5" cy="8" r="1.5"/></g></svg>',
            'bR': '<svg viewBox="0 0 45 45"><g fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M9 39h27v-3H9v3zM12 36h21l-1.5-4h-18L12 36zM11 14h23v7H11v-7zM14 21h17v11H14V21zM11 9h4v5h-4V9zM20.5 9h4v5h-4V9zM30 9h4v5h-4V9z"/></g></svg>',
            'bQ': '<svg viewBox="0 0 45 45"><g fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round"><path d="M8 36h29v-3H8v3zM11 33h23l-2-5H13l-2 5zM9 26l3.5-12 5.5 8 4.5-13 4.5 13 5.5-8 3.5 12H9z"/><circle cx="9" cy="12" r="2"/><circle cx="18" cy="9" r="2"/><circle cx="22.5" cy="6" r="2"/><circle cx="27" cy="9" r="2"/><circle cx="36" cy="12" r="2"/></g></svg>',
            'bK': '<svg viewBox="0 0 45 45"><g fill="#000" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22.5 11.63V6M20 8h5M22.5 25c-4 0-7.5 1.5-7.5 4v5h15v-5c0-2.5-3.5-4-7.5-4z"/><path d="M11.5 37h22v-3h-22v3zM22.5 11.5c-3.5 0-5.5 2.5-5.5 6.5 0 5 5.5 7 5.5 7s5.5-2 5.5-7c0-4-2-6.5-5.5-6.5z"/></g></svg>'
        };

        class SoundFX {
            constructor() {
                this.ctx = null;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playMove() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(150, this.ctx.currentTime + 0.08);
                gain.gain.setValueAtTime(0.3, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.08);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.08);
            }
            playCapture() {
                this.init();
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(600, this.ctx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(200, this.ctx.currentTime + 0.12);
                gain.gain.setValueAtTime(0.4, this.ctx.currentTime);
                gain.gain.linearRampToValueAtTime(0.01, this.ctx.currentTime + 0.12);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start();
                osc.stop(this.ctx.currentTime + 0.12);
            }
        }
        const sfx = new SoundFX();

        let game = new Chess();
        let selectedSquare = null;
        let legalMoves = [];
        let isFlipped = false;
        let lastMove = null;

        // Piece Values for Minimax Evaluation
        const weights = { p: 100, n: 320, b: 330, r: 500, q: 900, k: 20000 };
        const pstPawn = [
            0,  0,  0,  0,  0,  0,  0,  0,
            50, 50, 50, 50, 50, 50, 50, 50,
            10, 10, 20, 30, 30, 20, 10, 10,
            5,  5, 10, 25, 25, 10,  5,  5,
            0,  0,  0, 20, 20,  0,  0,  0,
            5, -5,-10,  0,  0,-10, -5,  5,
            5, 10, 10,-20,-20, 10, 10,  5,
            0,  0,  0,  0,  0,  0,  0,  0
        ];
        const pstKnight = [
            -50,-40,-30,-30,-30,-30,-40,-50,
            -40,-20,  0,  0,  0,  0,-20,-40,
            -30,  0, 10, 15, 15, 10,  0,-30,
            -30,  5, 15, 20, 20, 15,  5,-30,
            -30,  0, 15, 20, 20, 15,  0,-30,
            -30,  5, 10, 15, 15, 10,  5,-30,
            -40,-20,  0,  5,  5,  0,-20,-40,
            -50,-40,-30,-30,-30,-30,-40,-50
        ];

        function evaluateBoard(board) {
            let total = 0;
            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const piece = board[r][c];
                    if (piece) {
                        let val = weights[piece.type];
                        let idx = r * 8 + c;
                        if (piece.type === 'p') val += pstPawn[idx];
                        if (piece.type === 'n') val += pstKnight[idx];
                        total += piece.color === 'w' ? val : -val;
                    }
                }
            }
            return total;
        }

        function minimax(depth, alpha, beta, isMaximizing) {
            if (depth === 0 || game.game_over()) {
                return evaluateBoard(game.board());
            }

            const moves = game.moves();
            if (isMaximizing) {
                let maxEval = -Infinity;
                for (let move of moves) {
                    game.move(move);
                    let evalVal = minimax(depth - 1, alpha, beta, false);
                    game.undo();
                    maxEval = Math.max(maxEval, evalVal);
                    alpha = Math.max(alpha, evalVal);
                    if (beta <= alpha) break;
                }
                return maxEval;
            } else {
                let minEval = Infinity;
                for (let move of moves) {
                    game.move(move);
                    let evalVal = minimax(depth - 1, alpha, beta, true);
                    game.undo();
                    minEval = Math.min(minEval, evalVal);
                    beta = Math.min(beta, evalVal);
                    if (beta <= alpha) break;
                }
                return minEval;
            }
        }

        function makeAIMove() {
            if (game.game_over()) return;

            document.getElementById('ai-thinking').classList.remove('hidden');

            setTimeout(() => {
                const depth = parseInt(document.getElementById('difficulty').value);
                const moves = game.moves();
                let bestMove = null;
                let bestEval = Infinity;

                for (let move of moves) {
                    game.move(move);
                    let evalVal = minimax(depth - 1, -Infinity, Infinity, true);
                    game.undo();
                    if (evalVal < bestEval) {
                        bestEval = evalVal;
                        bestMove = move;
                    }
                }

                if (bestMove) {
                    const moveObj = game.move(bestMove);
                    lastMove = { from: moveObj.from, to: moveObj.to };
                    if (moveObj.captured) sfx.playCapture();
                    else sfx.playMove();
                }

                document.getElementById('ai-thinking').classList.add('hidden');
                updateUI();
            }, 100);
        }

        function renderBoard() {
            const boardElem = document.getElementById('board');
            boardElem.innerHTML = '';

            const files = ['a', 'b', 'c', 'd', 'e', 'f', 'g', 'h'];
            const ranks = ['8', '7', '6', '5', '4', '3', '2', '1'];

            const rOrder = isFlipped ? ranks.slice().reverse() : ranks;
            const fOrder = isFlipped ? files.slice().reverse() : files;

            let inCheckSquare = null;
            if (game.in_check()) {
                const board = game.board();
                const turn = game.turn();
                for (let r = 0; r < 8; r++) {
                    for (let c = 0; c < 8; c++) {
                        const p = board[r][c];
                        if (p && p.type === 'k' && p.color === turn) {
                            inCheckSquare = files[c] + ranks[r];
                        }
                    }
                }
            }

            for (let r = 0; r < 8; r++) {
                for (let c = 0; c < 8; c++) {
                    const squareId = fOrder[c] + rOrder[r];
                    const isLight = (files.indexOf(fOrder[c]) + ranks.indexOf(rOrder[r])) % 2 === 0;

                    const sqElem = document.createElement('div');
                    sqElem.className = `square ${isLight ? 'square-light' : 'square-dark'}`;
                    sqElem.dataset.square = squareId;

                    if (selectedSquare === squareId) {
                        sqElem.classList.add('square-selected');
                    }
                    if (lastMove && (lastMove.from === squareId || lastMove.to === squareId)) {
                        sqElem.classList.add('square-highlight-last');
                    }
                    if (squareId === inCheckSquare) {
                        sqElem.classList.add('square-highlight-check');
                    }

                    // Draw Move Hints
                    if (legalMoves.includes(squareId)) {
                        const pieceAtSquare = game.get(squareId);
                        const hint = document.createElement('div');
                        hint.className = pieceAtSquare ? 'capture-hint' : 'move-hint';
                        sqElem.appendChild(hint);
                    }

                    // Render Piece
                    const piece = game.get(squareId);
                    if (piece) {
                        const pieceKey = piece.color + piece.type.toUpperCase();
                        const pElem = document.createElement('div');
                        pElem.className = 'piece';
                        pElem.innerHTML = pieceSVG[pieceKey];
                        sqElem.appendChild(pElem);
                    }

                    sqElem.addEventListener('click', () => handleSquareClick(squareId));
                    boardElem.appendChild(sqElem);
                }
            }
        }

        function handleSquareClick(square) {
            if (game.turn() === 'b' || game.game_over()) return;

            if (selectedSquare === square) {
                selectedSquare = null;
                legalMoves = [];
                renderBoard();
                return;
            }

            if (selectedSquare) {
                const move = game.move({
                    from: selectedSquare,
                    to: square,
                    promotion: 'q'
                });

                if (move) {
                    lastMove = { from: move.from, to: move.to };
                    if (move.captured) sfx.playCapture();
                    else sfx.playMove();

                    selectedSquare = null;
                    legalMoves = [];
                    updateUI();

                    if (!game.game_over()) {
                        setTimeout(makeAIMove, 300);
                    }
                    return;
                }
            }

            const piece = game.get(square);
            if (piece && piece.color === 'w') {
                selectedSquare = square;
                const moves = game.moves({ square: square, verbose: true });
                legalMoves = moves.map(m => m.to);
            } else {
                selectedSquare = null;
                legalMoves = [];
            }
            renderBoard();
        }

        function updateUI() {
            renderBoard();
            updateHistory();
            updateCaptured();
            updateStatus();
        }

        function updateHistory() {
            const histElem = document.getElementById('move-history');
            const history = game.history({ verbose: true });
            histElem.innerHTML = '';

            for (let i = 0; i < history.length; i += 2) {
                const moveNum = Math.floor(i / 2) + 1;
                const whiteMove = history[i].san;
                const blackMove = history[i + 1] ? history[i + 1].san : '';

                const row = document.createElement('div');
                row.className = 'col-span-2 grid grid-cols-5 hover:bg-slate-700/50 p-1 rounded';
                row.innerHTML = `<span class="text-slate-500">${moveNum}.</span><span class="col-span-2 font-medium">${whiteMove}</span><span class="col-span-2 text-indigo-300 font-medium">${blackMove}</span>`;
                histElem.appendChild(row);
            }
            histElem.scrollTop = histElem.scrollHeight;
        }

        function updateCaptured() {
            const playerCap = document.getElementById('player-captured');
            const aiCap = document.getElementById('ai-captured');
            
            playerCap.innerHTML = '';
            aiCap.innerHTML = '';

            const history = game.history({ verbose: true });
            history.forEach(m => {
                if (m.captured) {
                    const capPiece = (m.color === 'w' ? 'b' : 'w') + m.captured.toUpperCase();
                    const wrapper = document.createElement('div');
                    wrapper.className = 'w-4 h-4 inline-block';
                    wrapper.innerHTML = pieceSVG[capPiece];

                    if (m.color === 'w') {
                        playerCap.appendChild(wrapper);
                    } else {
                        aiCap.appendChild(wrapper);
                    }
                }
            });
        }

        function updateStatus() {
            const badge = document.getElementById('status-badge');
            if (game.in_checkmate()) {
                badge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-rose-500/20 text-rose-400 border border-rose-500/30";
                badge.innerText = `Checkmate! ${game.turn() === 'w' ? 'Black' : 'White'} Wins`;
            } else if (game.in_draw() || game.in_stalemate() || game.in_threefold_repetition()) {
                badge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-amber-500/20 text-amber-400 border border-amber-500/30";
                badge.innerText = "Game Over: Draw";
            } else if (game.in_check()) {
                badge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-red-500/20 text-red-400 border border-red-500/30 animate-pulse";
                badge.innerText = `${game.turn() === 'w' ? "White" : "Black"} in Check`;
            } else {
                badge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30";
                badge.innerText = game.turn() === 'w' ? "White's Turn" : "AI Thinking...";
            }
        }

        document.getElementById('btn-new-game').addEventListener('click', () => {
            game.reset();
            selectedSquare = null;
            legalMoves = [];
            lastMove = null;
            updateUI();
        });

        document.getElementById('btn-flip').addEventListener('click', () => {
            isFlipped = !isFlipped;
            renderBoard();
        });

        document.getElementById('btn-undo').addEventListener('click', () => {
            game.undo(); // Undo AI Move
            game.undo(); // Undo Player Move
            selectedSquare = null;
            legalMoves = [];
            lastMove = null;
            updateUI();
        });

        document.getElementById('difficulty').addEventListener('change', (e) => {
            const names = { '1': 'Easy', '2': 'Medium', '3': 'Hard' };
            document.getElementById('ai-name').innerText = `Stockfish AI (${names[e.target.value]})`;
        });

        // Initialize First Render
        window.onload = function() {
            renderBoard();
            updateUI();
        };
    </script>
</body>
</html>
